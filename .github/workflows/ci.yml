name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.22.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit:dependencies
      - run: pnpm verify:zero-api
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.22.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
        env:
          CI: true
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7

  postgres-integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: forgerank_integration
          POSTGRES_USER: forgerank
          POSTGRES_PASSWORD: forgerank
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U forgerank -d forgerank_integration"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.22.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit:postgres
        env:
          DATABASE_URL: postgresql://forgerank:forgerank@127.0.0.1:5432/forgerank_integration

  docker-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - run: docker compose config --quiet
      - run: docker compose build web worker migrate
      - run: docker compose up -d --wait postgres
      - run: docker compose run --rm migrate
      - run: docker compose run --rm worker pnpm seed
      - run: docker compose up -d --wait web
      - run: curl --fail --show-error --silent http://127.0.0.1:3000/api/health/ready >/dev/null
      - run: curl --fail --show-error --silent http://127.0.0.1:3000/coverage >/dev/null
      - if: always()
        run: docker compose down --volumes --remove-orphans
